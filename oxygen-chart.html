<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isopleths of Oxygen Partial Pressure (pO₂)</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e0e0e0;
  }
  #container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 20px 30px;
  }
  .header {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
    gap: 12px;
    flex-shrink: 0;
  }
  .title {
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 600;
    color: #e94560;
    letter-spacing: 0.5px;
    line-height: 1.4;
  }
  .title i, .title sub {
    font-style: italic;
    font-weight: 400;
  }
  .controls-row {
    display: flex;
    gap: 20px;
    font-size: clamp(12px, 1vw, 14px);
    flex-wrap: wrap;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .atm-input {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 15px;
    padding-left: 15px;
    border-left: 1px solid rgba(255,255,255,0.2);
  }
  .atm-input label {
    color: #90e0ef;
    font-weight: 600;
  }
  .atm-input input {
    background: #16213e;
    border: 1px solid #90e0ef;
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    width: 80px;
    font-family: inherit;
    font-size: inherit;
  }
  .atm-input input:focus {
    outline: none;
    box-shadow: 0 0 5px rgba(144, 224, 239, 0.5);
  }
  .formula {
    margin-left: auto;
    font-style: italic;
    color: #90e0ef;
    font-family: 'Times New Roman', Times, serif;
    font-size: clamp(14px, 1.2vw, 16px);
    letter-spacing: 0.5px;
  }
  canvas {
    display: block;
    flex: 1;
    cursor: crosshair;
    min-height: 0;
  }
</style>
</head>
<body>
<div id="container">
  <div class="header">
    <div class="title">
      Isopleths of Oxygen Partial Pressure (<i>pO</i><sub>2</sub>) as a function of Depth and Oxygen Fraction (<i>F</i><sub>O<sub>2</sub></sub>)
    </div>

    <div class="controls-row">
      <div class="legend-item"><div class="swatch" style="background:#6c757d"></div> Hypoxic (&lt; 1.0)</div>
      <div class="legend-item"><div class="swatch" style="background:#00b4d8"></div> Normoxic (1.0 - 1.4)</div>
      <div class="legend-item"><div class="swatch" style="background:#f9c74f"></div> Hyperoxic (1.4 - 1.6)</div>
      <div class="legend-item"><div class="swatch" style="background:#e94560"></div> Toxic (&gt; 1.6)</div>

      <!-- Atmospheric Pressure Input in hPa -->
      <div class="atm-input">
        <label for="atm-val">Surface Pressure (hPa):</label>
        <input type="number" id="atm-val" value="1013.25" step="1" min="500" max="1100">
      </div>

      <div class="formula">
        pO<sub>2</sub> = F<sub>O<sub>2</sub></sub> × (P<sub>atm</sub>/1013.25 + D/10.06)
      </div>
    </div>
  </div>
  <canvas id="chart"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const atmInput = document.getElementById('atm-val');

  let W = 0, H = 0;
  let M = { top: 10, right: 20, bottom: 40, left: 60 };
  let plotW = 0, plotH = 0;

  const fracMin = 0, fracMax = 1.0;
  const depthMin = 0, depthMax = 60;

  // Constants
  const MSW_PER_ATM = 10.06;
  const STANDARD_HPA = 1013.25;

  function xScale(f) { return M.left + (f - fracMin) / (fracMax - fracMin) * plotW; }
  function yScale(d) { return M.top + (d - depthMin) / (depthMax - depthMin) * plotH; }
  function invX(px) { return fracMin + (px - M.left) / plotW * (fracMax - fracMin); }
  function invY(py) { return depthMin + (py - M.top) / plotH * (depthMax - depthMin); }

  // Partial pressure calculation using hPa input
  function pO2(fraction, depth, pressureHpa) {
    const atm = pressureHpa / STANDARD_HPA;
    return fraction * (atm + depth / MSW_PER_ATM);
  }

  let mouse = { x: -1, y: -1, inPlot: false };

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const headerHeight = document.querySelector('.header').offsetHeight;

    W = rect.width - 60;
    H = rect.height - headerHeight - 40;

    if (W <= 0 || H <= 0) return;

    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.scale(dpr, dpr);

    M.left = W < 600 ? 50 : 60;
    M.bottom = H < 400 ? 40 : 50;
    M.top = 10;
    M.right = 20;

    plotW = W - M.left - M.right;
    plotH = H - M.top - M.bottom;

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Get current pressure in hPa
    let currentHpa = parseFloat(atmInput.value);
    if (isNaN(currentHpa) || currentHpa <= 0) currentHpa = STANDARD_HPA;

    // --- Heatmap ---
    const steps = 100;
    for (let i = 0; i < steps; i++) {
      const d0 = depthMin + (depthMax - depthMin) * i / steps;
      const d1 = depthMin + (depthMax - depthMin) * (i + 1) / steps;
      const y0 = yScale(d0);
      const y1 = yScale(d1);

      for (let j = 0; j < steps; j++) {
        const f0 = fracMin + (fracMax - fracMin) * j / steps;
        const f1 = fracMin + (fracMax - fracMin) * (j + 1) / steps;
        const x0 = xScale(f0);
        const x1 = xScale(f1);

        const o2 = pO2((f0 + f1) / 2, (d0 + d1) / 2, currentHpa);

        let color;
        if (o2 < 1.0) {
          color = `rgba(108, 117, 125, ${0.05 + (o2 / 1.0) * 0.2})`;
        } else if (o2 <= 1.4) {
          color = `rgba(0, 180, 216, ${0.15 + (1 - Math.abs(o2 - 1.2) / 0.2) * 0.2})`;
        } else if (o2 <= 1.6) {
          color = `rgba(249, 199, 79, ${0.15 + (1 - Math.abs(o2 - 1.5) / 0.1) * 0.2})`;
        } else {
          color = `rgba(233, 69, 96, ${Math.min(0.5, 0.1 + (o2 - 1.6) * 0.2)})`;
        }

        ctx.fillStyle = color;
        ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      }
    }

    // --- Grid and Axes ---
    const fontSize = W < 600 ? '11px' : '13px';
    ctx.font = `${fontSize} system-ui, sans-serif`;

    // X-Axis Grid (Oxygen Fraction)
    for (let f = 0; f <= 1.0; f += 0.1) {
      const x = xScale(f);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.moveTo(x, M.top);
      ctx.lineTo(x, M.top + plotH);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#a0a0b0';
      ctx.fillText((f * 100).toFixed(0) + '%', x, M.top + plotH + 10);
    }

    // Y-Axis Grid (Depth)
    for (let d = depthMin; d <= depthMax; d += 10) {
      const y = yScale(d);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.moveTo(M.left, y);
      ctx.lineTo(M.left + plotW, y);
      ctx.stroke();

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#a0a0b0';
      ctx.fillText(d + ' m', M.left - 10, y);
    }

    // Y-Axis Title
    ctx.save();
    ctx.translate(20, M.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e0e0e0';
    ctx.font = `${W < 600 ? '12px' : '14px'} system-ui, sans-serif`;
    ctx.fillText('Depth (m)', 0, 0);
    ctx.restore();

    // X-Axis Title
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#e0e0e0';
    ctx.font = `${W < 600 ? '12px' : '14px'} system-ui, sans-serif`;
    ctx.fillText('Oxygen Fraction (FO₂)', M.left + plotW / 2, M.top + plotH + 30);

    // --- Hover ---
    if (mouse.inPlot) {
      const fraction = invX(mouse.x);
      const depth = invY(mouse.y);
      const o2 = pO2(fraction, depth, currentHpa);

      // Guide Lines
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(M.left, mouse.y);
      ctx.lineTo(M.left + plotW, mouse.y);
      ctx.moveTo(mouse.x, M.top);
      ctx.lineTo(mouse.x, M.top + plotH);
      ctx.stroke();
      ctx.setLineDash([]);

      // Hover Point
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = o2 >= 1.0 && o2 <= 1.4 ? '#00b4d8' : (o2 < 1.0 ? '#6c757d' : (o2 <= 1.6 ? '#f9c74f' : '#e94560'));
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Tooltip Content
      const lines = [
        `FO₂: ${(fraction * 100).toFixed(1)}%`,
        `Depth: ${depth.toFixed(1)} m`,
        `pO₂: ${o2.toFixed(2)} bar`,
        o2 < 1.0 ? 'Hypoxic' : (o2 <= 1.4 ? 'Normoxic' : (o2 <= 1.6 ? 'Hyperoxic' : 'Toxic')),
        `pO₂ = ${fraction.toFixed(2)} × (${(currentHpa / STANDARD_HPA).toFixed(2)} + ${(depth / MSW_PER_ATM).toFixed(2)})`
      ];

      ctx.font = `${fontSize} system-ui, sans-serif`;
      const padding = 12;
      const lineH = 22;
      const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const boxW = textW + padding * 2;
      const boxH = lines.length * lineH + padding * 2;

      // Tooltip Positioning
      let bx = mouse.x + 15;
      let by = mouse.y - boxH / 2;
      if (bx + boxW > W) bx = mouse.x - boxW - 15;
      if (by < M.top) by = M.top;
      if (by + boxH > M.top + plotH) by = M.top + plotH - boxH;

      // Draw Box
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(15, 52, 96, 0.95)';
      roundRect(bx, by, boxW, boxH, 8);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(233, 69, 96, 0.8)';
      ctx.lineWidth = 1.5;
      roundRect(bx, by, boxW, boxH, 8);
      ctx.stroke();

      // Draw Text
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      lines.forEach((l, i) => {
        let textColor = '#e0e0e0';
        if (i === 3) textColor = o2 < 1.0 ? '#6c757d' : (o2 <= 1.4 ? '#00b4d8' : (o2 <= 1.6 ? '#f9c74f' : '#e94560'));
        else if (i === 2) textColor = '#fff';
        else if (i === 4) {
          textColor = '#90e0ef';
          ctx.font = `bold ${fontSize} system-ui, sans-serif`;
        } else {
          ctx.font = `${fontSize} system-ui, sans-serif`;
        }
        ctx.fillStyle = textColor;
        ctx.fillText(l, bx + padding, by + padding + i * lineH);
      });
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // Event Listeners
  canvas.addEventListener('mousemove', e => {
    const p = getPos(e);
    mouse.x = p.x;
    mouse.y = p.y;
    mouse.inPlot = p.x >= M.left && p.x <= M.left + plotW &&
                   p.y >= M.top && p.y <= M.top + plotH;
    draw();
  });

  canvas.addEventListener('mouseleave', () => {
    mouse.inPlot = false;
    draw();
  });

  atmInput.addEventListener('input', draw);
  atmInput.addEventListener('change', draw);

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
