<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oxygen Partial Pressure vs Depth & Gas Mixture</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: system-ui, sans-serif;
    color: #e0e0e0;
  }
  #container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .title {
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 600;
    color: #e94560;
  }
  .legend {
    display: flex;
    gap: 15px;
    font-size: clamp(12px, 1vw, 14px);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
  }
  canvas {
    display: block;
    flex: 1;
    cursor: crosshair;
    border-radius: 8px;
    background: #16213e;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    min-height: 0; /* Crucial for flexbox to allow canvas to shrink */
  }
</style>
</head>
<body>
<div id="container">
  <div class="header">
    <div class="title">ppO₂ vs Gas Mixture & Depth</div>
    <div class="legend">
      <div class="legend-item"><div class="swatch" style="background:#6c757d"></div> Hypoxic (&lt; 1.0 bar)</div>
      <div class="legend-item"><div class="swatch" style="background:#00b4d8"></div> Safe (1.0 - 1.4 bar)</div>
      <div class="legend-item"><div class="swatch" style="background:#f9c74f"></div> Caution (1.4 - 1.6 bar)</div>
      <div class="legend-item"><div class="swatch" style="background:#e94560"></div> Dangerous (&gt; 1.6 bar)</div>
    </div>
  </div>
  <canvas id="chart"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  
  // State
  let W = 0, H = 0;
  let M = { top: 30, right: 40, bottom: 60, left: 80 };
  let plotW = 0, plotH = 0;

  // Data Ranges
  const fracMin = 0, fracMax = 1.0;
  const depthMin = 0, depthMax = 60;

  // Helper functions
  function xScale(f) { return M.left + (f - fracMin) / (fracMax - fracMin) * plotW; }
  function yScale(d) { return M.top + (d - depthMin) / (depthMax - depthMin) * plotH; }
  function invX(px) { return fracMin + (px - M.left) / plotW * (fracMax - fracMin); }
  function invY(py) { return depthMin + (py - M.top) / plotH * (depthMax - depthMin); }
  function ppO2(fraction, depth) { return fraction * (1 + depth / 10); }

  let mouse = { x: -1, y: -1, inPlot: false };

  // Resize Handler
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    
    // We subtract the header height to keep it responsive
    const headerHeight = document.querySelector('.header').offsetHeight + 30; 
    
    W = rect.width - 40;
    H = rect.height - headerHeight;

    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    
    ctx.scale(dpr, dpr);

    // Adjust margins based on screen size
    M.left = W < 600 ? 60 : 80;
    M.bottom = H < 400 ? 40 : 60;
    M.top = 30;
    M.right = 40;

    plotW = W - M.left - M.right;
    plotH = H - M.top - M.bottom;

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Plot Background
    ctx.fillStyle = '#0f3460';
    ctx.fillRect(M.left, M.top, plotW, plotH);

    // --- Draw ppO2 Heatmap ---
    const steps = 100; // Reduced for performance, still looks smooth
    for (let i = 0; i < steps; i++) {
      const d0 = depthMin + (depthMax - depthMin) * i / steps;
      const d1 = depthMin + (depthMax - depthMin) * (i + 1) / steps;
      const y0 = yScale(d0);
      const y1 = yScale(d1);

      for (let j = 0; j < steps; j++) {
        const f0 = fracMin + (fracMax - fracMin) * j / steps;
        const f1 = fracMin + (fracMax - fracMin) * (j + 1) / steps;
        const x0 = xScale(f0);
        const x1 = xScale(f1);

        const o2 = ppO2((f0 + f1) / 2, (d0 + d1) / 2);
        
        let color;
        if (o2 < 1.0) {
          color = `rgba(108, 117, 125, ${0.05 + (o2 / 1.0) * 0.2})`;
        } else if (o2 <= 1.4) {
          color = `rgba(0, 180, 216, ${0.15 + (1 - Math.abs(o2 - 1.2) / 0.2) * 0.2})`;
        } else if (o2 <= 1.6) {
          color = `rgba(249, 199, 79, ${0.15 + (1 - Math.abs(o2 - 1.5) / 0.1) * 0.2})`;
        } else {
          color = `rgba(233, 69, 96, ${Math.min(0.5, 0.1 + (o2 - 1.6) * 0.2)})`;
        }

        ctx.fillStyle = color;
        ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      }
    }

    // --- Draw Grid and Axes ---
    const fontSize = W < 600 ? '11px' : '13px';
    ctx.font = `${fontSize} system-ui, sans-serif`;

    // Vertical Grid (Oxygen Fraction)
    for (let f = 0; f <= 1.0; f += 0.1) {
      const x = xScale(f);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.moveTo(x, M.top);
      ctx.lineTo(x, M.top + plotH);
      ctx.stroke();
      
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#a0a0b0';
      ctx.fillText((f * 100).toFixed(0) + '%', x, M.top + plotH + 10);
    }

    // Horizontal Grid (Depth)
    for (let d = depthMin; d <= depthMax; d += 10) {
      const y = yScale(d);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.moveTo(M.left, y);
      ctx.lineTo(M.left + plotW, y);
      ctx.stroke();
      
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#a0a0b0';
      ctx.fillText(d + ' m', M.left - 10, y);
    }

    // Axis Titles
    ctx.save();
    ctx.translate(25, M.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e0e0e0';
    ctx.font = `${W < 600 ? '12px' : '14px'} system-ui, sans-serif`;
    ctx.fillText('Depth (meters)', 0, 0);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#e0e0e0';
    ctx.fillText('Oxygen Fraction (%)', M.left + plotW / 2, M.top + plotH + 35);

    // --- Draw Hover Elements ---
    if (mouse.inPlot) {
      const fraction = invX(mouse.x);
      const depth = invY(mouse.y);
      const o2 = ppO2(fraction, depth);

      // Guide Lines
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(M.left, mouse.y);
      ctx.lineTo(M.left + plotW, mouse.y);
      ctx.moveTo(mouse.x, M.top);
      ctx.lineTo(mouse.x, M.top + plotH);
      ctx.stroke();
      ctx.setLineDash([]);

      // Hover Point
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = o2 >= 1.0 && o2 <= 1.4 ? '#00b4d8' : (o2 < 1.0 ? '#6c757d' : (o2 <= 1.6 ? '#f9c74f' : '#e94560'));
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Tooltip
      const lines = [
        `O₂ Fraction: ${(fraction * 100).toFixed(1)}%`,
        `Depth: ${depth.toFixed(1)} m`,
        `ppO₂: ${o2.toFixed(2)} bar`,
        o2 < 1.0 ? '⚠️ Hypoxic' : (o2 <= 1.4 ? '✅ Safe' : (o2 <= 1.6 ? '⚠️ Caution' : '❌ Dangerous'))
      ];
      ctx.font = `${fontSize} system-ui, sans-serif`;
      const padding = 12;
      const lineH = 20;
      const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const boxW = textW + padding * 2;
      const boxH = lines.length * lineH + padding * 2;

      let bx = mouse.x + 15;
      let by = mouse.y - boxH / 2;
      if (bx + boxW > W) bx = mouse.x - boxW - 15;
      if (by < M.top) by = M.top;
      if (by + boxH > M.top + plotH) by = M.top + plotH - boxH;

      // Box
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(15, 52, 96, 0.95)';
      roundRect(bx, by, boxW, boxH, 8);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(233, 69, 96, 0.8)';
      ctx.lineWidth = 1.5;
      roundRect(bx, by, boxW, boxH, 8);
      ctx.stroke();

      // Text
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      lines.forEach((l, i) => {
        let textColor = '#e0e0e0';
        if (i === 3) textColor = o2 < 1.0 ? '#6c757d' : (o2 <= 1.4 ? '#00b4d8' : (o2 <= 1.6 ? '#f9c74f' : '#e94560'));
        else if (i === 2) textColor = '#fff';
        ctx.fillStyle = textColor;
        ctx.fillText(l, bx + padding, by + padding + i * lineH);
      });
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Mouse Events
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width * (window.devicePixelRatio || 1));
    const scaleY = canvas.height / (rect.height * (window.devicePixelRatio || 1));
    
    // Convert client coords to canvas CSS coords, not raw pixel coords
    const x = (e.clientX - rect.left);
    const y = (e.clientY - rect.top);
    return { x, y };
  }

  canvas.addEventListener('mousemove', e => {
    const p = getPos(e);
    mouse.x = p.x;
    mouse.y = p.y;
    mouse.inPlot = p.x >= M.left && p.x <= M.left + plotW &&
                   p.y >= M.top && p.y <= M.top + plotH;
    draw();
  });

  canvas.addEventListener('mouseleave', () => {
    mouse.inPlot = false;
    draw();
  });

  // Initialize and handle resizing
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
